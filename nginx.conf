# ─── HTTP Server (Redirect to HTTPS) ──────────────────────────────
server {
    listen       80;
    server_name  cheachantocollege.edu.kh www.cheachantocollege.edu.kh _;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

# ─── HTTPS / TLS Server ───────────────────────────────────────────
server {
    listen       443 ssl;
    server_name  cheachantocollege.edu.kh www.cheachantocollege.edu.kh _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ── TLS / SSL Configuration ───────────────────────────────────
    ssl_certificate     /etc/ssl/certs/cheachantocollege.crt;
    ssl_certificate_key /etc/ssl/private/cheachantocollege.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Gzip compression ──────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ── Cache static assets aggressively ──────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── NestJS API Proxy (uncomment when backend is ready) ────────────
    # location /api/ {
    #     proxy_pass         http://api:3000/;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Upgrade    $http_upgrade;
    #     proxy_set_header   Connection 'upgrade';
    #     proxy_set_header   Host       $host;
    #     proxy_cache_bypass $http_upgrade;
    # }

    # ── React Router – all unknown paths fall back to index.html ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Security headers ──────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}

